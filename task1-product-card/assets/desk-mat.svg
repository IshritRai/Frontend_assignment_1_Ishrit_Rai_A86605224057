<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img" aria-labelledby="title">
  <title id="title">Desk workspace mat with keyboard, mouse, mug and plant</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0e7ff"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="mat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="keys" x="100" y="180" width="26" height="24" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="22" height="20" rx="4" fill="#f8fafc"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1e1b4b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="600" height="450" fill="url(#bg)"/>

  <!-- the mat with a stitched edge -->
  <rect x="40" y="110" width="520" height="250" rx="22" fill="url(#mat)" filter="url(#shadow)"/>
  <rect x="52" y="122" width="496" height="226" rx="14" fill="none" stroke="#64748b"
        stroke-width="2" stroke-dasharray="7 6"/>

  <!-- keyboard -->
  <rect x="90" y="170" width="332" height="116" rx="14" fill="#cbd5e1" filter="url(#shadow)"/>
  <rect x="100" y="180" width="312" height="72" fill="url(#keys)"/>
  <rect x="152" y="254" width="208" height="20" rx="5" fill="#f8fafc"/>

  <!-- mouse -->
  <rect x="460" y="186" width="56" height="88" rx="28" fill="#e2e8f0" filter="url(#shadow)"/>
  <line x1="488" y1="188" x2="488" y2="222" stroke="#94a3b8" stroke-width="2"/>

  <!-- coffee mug -->
  <circle cx="515" cy="62" r="32" fill="#f8fafc" filter="url(#shadow)"/>
  <circle cx="515" cy="62" r="23" fill="#78350f"/>
  <rect x="543" y="54" width="22" height="16" rx="8" fill="none" stroke="#f8fafc" stroke-width="6"/>

  <!-- plant -->
  <circle cx="78" cy="402" r="30" fill="#f8fafc" filter="url(#shadow)"/>
  <ellipse cx="62" cy="388" rx="14" ry="26" fill="#16a34a" transform="rotate(-35 62 388)"/>
  <ellipse cx="94" cy="388" rx="14" ry="26" fill="#22c55e" transform="rotate(35 94 388)"/>
  <ellipse cx="78" cy="380" rx="12" ry="26" fill="#15803d"/>
</svg>
