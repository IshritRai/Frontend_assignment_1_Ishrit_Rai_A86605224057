<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Task 1 - Responsive product showcase card built with CSS Grid and Flexbox">
  <title>Task 1 · Product Showcase Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="component-container">
    <article class="product-card" aria-labelledby="product-title">

      <!-- image -->
      <figure class="product-media">
        <span class="badge">Popular</span>
        <img src="assets/desk-mat.jpg"
             alt="Grey felt desk mat on a wooden desk with a laptop, mouse and plant"
             width="1200" height="900">
      </figure>

      <!-- details -->
      <div class="product-details">
        <div class="product-info">
          <div class="meta-row">
            <span class="category">Workspace</span>
            <span class="rating" aria-label="Rated 4.9 out of 5">4.9 <span aria-hidden="true">★</span></span>
          </div>

          <h1 id="product-title" class="product-title">Desk Workspace Mat</h1>

          <p class="product-description">
            An extra-large felt and vegan-leather mat that protects your desk,
            keeps your keyboard and mouse in place and makes any setup feel calm.
          </p>

          <h2 class="feature-heading">Features</h2>
          <ul class="feature-list">
            <li>Water-resistant</li>
            <li>Non-slip base</li>
            <li>90 × 40 cm</li>
            <li>Stitched edges</li>
            <li>Reversible</li>
          </ul>
        </div>

        <div class="purchase-shelf">
          <p class="price">
            <span class="price-amount">₹1,499</span>
            <span class="price-note">Tax included</span>
          </p>
          <button class="btn-add" type="button">Add to Bag</button>
        </div>
      </div>

    </article>
  </main>
</body>
</html>
