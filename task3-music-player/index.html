<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Task 3 - Dark-mode mini music player with an Up Next playlist">
  <title>Task 3 · Music Player &amp; Playlist Shelf</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="component-container">
    <section class="player" aria-label="Mini music player">

      <!-- now playing -->
      <div class="now-playing">
        <div class="vinyl" aria-hidden="true">
          <div class="vinyl-label"></div>
        </div>

        <div class="track-meta">
          <p class="eyebrow">Now Playing</p>
          <h1 class="track-name">Midnight Echoes</h1>
          <p class="artist">Cyber Wave • 2026</p>
        </div>

        <div class="progress" aria-label="Playback position 1:24 of 3:42">
          <span class="time">1:24</span>
          <span class="progress-track"><span class="progress-fill"></span></span>
          <span class="time">3:42</span>
        </div>

        <div class="controls">
          <button class="control" type="button" aria-label="Shuffle">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
          </button>
          <button class="control" type="button" aria-label="Previous track">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 20 9 12l10-8v16zM5 19V5"/></svg>
          </button>
          <button class="control control--play" type="button" aria-label="Pause">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h3v16H7zM14 4h3v16h-3z"/></svg>
          </button>
          <button class="control" type="button" aria-label="Next track">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 4 10 8-10 8V4zM19 5v14"/></svg>
          </button>
          <button class="control" type="button" aria-label="Repeat">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m17 1 4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/></svg>
          </button>
        </div>
      </div>

      <!-- queue -->
      <div class="queue">
        <header class="queue-header">
          <h2>Up Next</h2>
          <span class="queue-count">5 tracks</span>
        </header>

        <ol class="track-list">
          <li class="track track--active">
            <span class="track-title">
              <span class="track-num">01</span>
              Neon Route
            </span>
            <span class="now-badge">
              <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
              Play
            </span>
          </li>
          <li class="track">
            <span class="track-title"><span class="track-num">02</span> Silicon Drift</span>
            <span class="track-duration">4:15</span>
          </li>
          <li class="track">
            <span class="track-title"><span class="track-num">03</span> Digital Rain</span>
            <span class="track-duration">2:58</span>
          </li>
          <li class="track">
            <span class="track-title"><span class="track-num">04</span> Night Ride</span>
            <span class="track-duration">3:10</span>
          </li>
          <li class="track">
            <span class="track-title"><span class="track-num">05</span> Static Hearts</span>
            <span class="track-duration">3:27</span>
          </li>
        </ol>
      </div>

    </section>
  </main>
</body>
</html>
