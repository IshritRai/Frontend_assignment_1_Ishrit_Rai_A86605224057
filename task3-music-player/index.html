<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Task 3 - Dark-mode mini music player with an Up Next playlist">
  <title>Task 3 · Music Player &amp; Playlist Shelf</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="component-container">
    <section class="player" aria-label="Mini music player">

      <!-- Album / now playing column -->
      <div class="now-playing">
        <div class="vinyl" aria-hidden="true">
          <div class="vinyl-label"></div>
        </div>

        <div class="track-meta">
          <p class="eyebrow">Now Playing</p>
          <h1 class="track-name">Midnight Echoes</h1>
          <p class="artist">Cyber Wave • 2026</p>
        </div>
      </div>

    </section>
  </main>
</body>
</html>
