<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="title">
  <title id="title">Illustrated portrait of Alex Rivera</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#fca5a5"/>
    </linearGradient>
    <clipPath id="circle"><circle cx="100" cy="100" r="100"/></clipPath>
  </defs>
  <g clip-path="url(#circle)">
    <rect width="200" height="200" fill="url(#bg)"/>
    <!-- shoulders / hoodie -->
    <path d="M30 200c4-42 34-64 70-64s66 22 70 64z" fill="#312e81"/>
    <path d="M84 138h32l-16 22z" fill="#c7d2fe"/>
    <!-- neck -->
    <rect x="88" y="112" width="24" height="28" rx="10" fill="#c68863"/>
    <!-- head -->
    <ellipse cx="100" cy="88" rx="34" ry="38" fill="#d9a07b"/>
    <!-- hair -->
    <path d="M64 86c-4-30 14-50 38-50 26 0 40 18 36 46-6-14-16-22-30-24-14 8-30 12-44 28z" fill="#1f2937"/>
    <!-- glasses -->
    <g fill="none" stroke="#111827" stroke-width="3">
      <circle cx="86" cy="92" r="10"/>
      <circle cx="114" cy="92" r="10"/>
      <path d="M96 92h8"/>
    </g>
    <!-- smile -->
    <path d="M90 108c6 6 14 6 20 0" fill="none" stroke="#7c2d12" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
