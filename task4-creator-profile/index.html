<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Task 4 - Responsive creator profile header with stats grid and story highlights">
  <title>Task 4 · Creator Profile Header</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="component-container">
    <article class="profile-card" aria-labelledby="username">

      <header class="profile-header">
        <div class="avatar-ring">
          <img class="avatar" src="assets/avatar.svg" alt="Alex Rivera's profile picture" width="160" height="160">
        </div>

        <div class="profile-details">
          <div class="profile-top">
            <h1 id="username" class="username">
              alex_designer
              <svg class="verified" viewBox="0 0 24 24" role="img" aria-label="Verified account">
                <path d="M12 1.5 15 4l3.9-.3.7 3.8 3.1 2.4-1.7 3.5 1.7 3.5-3.1 2.4-.7 3.8L15 23.4 12 21l-3 2.4-3.9-.3-.7-3.8L1.3 16.9 3 13.4 1.3 9.9l3.1-2.4.7-3.8L9 4z"/>
                <path class="tick" d="m7.5 12.5 3 3 6-6.5"/>
              </svg>
            </h1>
            <div class="profile-actions">
              <button class="btn btn-follow" type="button">Follow</button>
              <button class="btn btn-message" type="button">Message</button>
            </div>
          </div>

          <ul class="stats" aria-label="Profile statistics">
            <li class="stat"><strong>148</strong><span>Posts</span></li>
            <li class="stat"><strong>12.4k</strong><span>Followers</span></li>
            <li class="stat"><strong>420</strong><span>Following</span></li>
          </ul>

          <div class="bio">
            <p class="display-name">Alex Rivera <span class="role">• UI Engineer</span></p>
            <p>Building web design systems and open source widgets.</p>
            <a class="website" href="#portfolio">portfolio-alex.dev</a>
          </div>
        </div>
      </header>

      <section class="highlights" aria-labelledby="highlights-title">
        <h2 id="highlights-title" class="section-label">Story Highlights</h2>
        <ul class="highlight-strip">
          <li class="highlight">
            <span class="highlight-ring"><span class="highlight-circle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span></span>
            <span class="highlight-label">Design</span>
          </li>
          <li class="highlight">
            <span class="highlight-ring"><span class="highlight-circle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18v13H3zM8 7V4h8v3"/></svg></span></span>
            <span class="highlight-label">Projects</span>
          </li>
          <li class="highlight">
            <span class="highlight-ring"><span class="highlight-circle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 6-6 6 6 6M16 6l6 6-6 6"/></svg></span></span>
            <span class="highlight-label">Work</span>
          </li>
          <li class="highlight">
            <span class="highlight-ring"><span class="highlight-circle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></span></span>
            <span class="highlight-label">Tips</span>
          </li>
          <li class="highlight">
            <span class="highlight-ring"><span class="highlight-circle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20z"/></svg></span></span>
            <span class="highlight-label">Travel</span>
          </li>
          <li class="highlight">
            <span class="highlight-ring"><span class="highlight-circle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3zM19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/></svg></span></span>
            <span class="highlight-label">Talks</span>
          </li>
          <li class="highlight">
            <span class="highlight-ring"><span class="highlight-circle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 4h20v12H2zM7 20h10"/></svg></span></span>
            <span class="highlight-label">Setup</span>
          </li>
          <li class="highlight">
            <span class="highlight-ring"><span class="highlight-circle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5zM4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg></span></span>
            <span class="highlight-label">Books</span>
          </li>
          <li class="highlight highlight--new">
            <span class="highlight-ring"><span class="highlight-circle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span></span>
            <span class="highlight-label">New</span>
          </li>
        </ul>
      </section>

    </article>
  </main>
</body>
</html>
