<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Task 4 - Responsive creator profile header with stats grid and story highlights">
  <title>Task 4 · Creator Profile Header</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="component-container">
    <article class="profile-card" aria-labelledby="username">

      <header class="profile-header">
        <div class="avatar-ring">
          <img class="avatar" src="assets/avatar.svg" alt="Alex Rivera's profile picture" width="160" height="160">
        </div>

        <div class="profile-details">
          <div class="profile-top">
            <h1 id="username" class="username">
              alex_designer
              <svg class="verified" viewBox="0 0 24 24" role="img" aria-label="Verified account">
                <path d="M12 1.5 15 4l3.9-.3.7 3.8 3.1 2.4-1.7 3.5 1.7 3.5-3.1 2.4-.7 3.8L15 23.4 12 21l-3 2.4-3.9-.3-.7-3.8L1.3 16.9 3 13.4 1.3 9.9l3.1-2.4.7-3.8L9 4z"/>
                <path class="tick" d="m7.5 12.5 3 3 6-6.5"/>
              </svg>
            </h1>
            <div class="profile-actions">
              <button class="btn btn-follow" type="button">Follow</button>
              <button class="btn btn-message" type="button">Message</button>
            </div>
          </div>

          <ul class="stats" aria-label="Profile statistics">
            <li class="stat"><strong>148</strong><span>Posts</span></li>
            <li class="stat"><strong>12.4k</strong><span>Followers</span></li>
            <li class="stat"><strong>420</strong><span>Following</span></li>
          </ul>

          <div class="bio">
            <p class="display-name">Alex Rivera <span class="role">• UI Engineer</span></p>
            <p>Building web design systems and open source widgets.</p>
            <a class="website" href="#portfolio">portfolio-alex.dev</a>
          </div>
        </div>
      </header>

    </article>
  </main>
</body>
</html>
